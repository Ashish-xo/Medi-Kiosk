# RoadSence-compatible Nixpacks config for MediKiosk
# ffmpeg is REQUIRED: the server converts mic audio (webm) → wav before STT.
# aptPkgs is reliable on Railway's Debian build image (nixPkgs silently no-ops there).
[phases.setup]
aptPkgs = ["ffmpeg"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]
